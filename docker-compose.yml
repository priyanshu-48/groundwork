# Local dev. All ports bind to 127.0.0.1 only. Credentials here are local-only defaults.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundwork}
      POSTGRES_DB: groundwork
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork"]
      interval: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:latest  # MinIO's public images were removed; see docs/decisions/0001
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-s3-local-only}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-s3-local-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [s3data:/data]

  s3-init:
    image: amazon/aws-cli
    depends_on: [s3]
    entrypoint: >
      /bin/sh -c "for i in $$(seq 30); do aws --endpoint-url http://s3:9000 s3 mb s3://groundwork && exit 0; sleep 1; done; exit 1"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3-local-only}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3-local-only}
      AWS_DEFAULT_REGION: us-east-1

  api:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwork:${POSTGRES_PASSWORD:-groundwork}@postgres:5432/groundwork
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-not-for-production-use}
      S3_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: groundwork
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3-local-only}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3-local-only}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker.runner"]
    depends_on:
      api: {condition: service_healthy}  # api container runs the migrations first
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwork:${POSTGRES_PASSWORD:-groundwork}@postgres:5432/groundwork
      S3_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: groundwork
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3-local-only}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3-local-only}
      # Set GEMINI_API_KEY in your shell or a git-ignored .env; AI_PROVIDER=fake runs without one.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_MIN_INTERVAL_S: ${EMBEDDING_MIN_INTERVAL_S:-0}
      EXTRACTION_MIN_INTERVAL_S: ${EXTRACTION_MIN_INTERVAL_S:-0}
      EXTRACTION_ENABLED: ${EXTRACTION_ENABLED:-true}
      GEMINI_MODELS: ${GEMINI_MODELS:-}

volumes:
  pgdata:
  s3data:
