# Local rehearsal of docker-compose.prod.yml: adds a throwaway S3 (RustFS) because production uses real
# object storage. Usage (from the repo root, env file as in docs/deploy.md "Local dry run"):
#   docker compose -p gwdry --env-file <env> -f docker-compose.prod.yml -f deploy/common/compose.dryrun.yml up -d --build
services:
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: dryrun-local
      RUSTFS_SECRET_KEY: dryrun-local
  s3-init:
    image: amazon/aws-cli
    depends_on: [s3]
    entrypoint: >
      /bin/sh -c "for i in $$(seq 30); do aws --endpoint-url http://s3:9000 s3 mb s3://$${S3_BUCKET} && exit 0; sleep 1; done; exit 1"
    environment:
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: dryrun-local
      AWS_SECRET_ACCESS_KEY: dryrun-local
      AWS_DEFAULT_REGION: us-east-1
  api:
    depends_on:
      s3-init: {condition: service_completed_successfully}
    environment:
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY: dryrun-local
      S3_SECRET_KEY: dryrun-local
  worker:
    environment:
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY: dryrun-local
      S3_SECRET_KEY: dryrun-local
